extends: [["spectral:oas", recommended]]
rules:
  # The spec is generated by utoipa from Rust code; descriptions and
  # examples live where the generator can attach them. Style-only rules
  # that would force churn in generated output are off.
  operation-description: off
  operation-tags: off
  openapi-tags-alphabetical: off
  operation-tag-defined: off
  info-contact: off
  info-description: off
  operation-success-response: off
  oas3-operation-security-defined: off
  # Embedded API served same-origin with the SPA; there is no public
  # server URL to advertise.
  oas3-api-servers: off
