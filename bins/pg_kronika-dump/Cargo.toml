[package]
name = "pg_kronika-dump"
description = "Read-only JSON inspection for PgKronika data files and directories"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kronika-format = { path = "../../crates/kronika-format" }
kronika-layout = { path = "../../crates/kronika-layout" }
kronika-reader = { path = "../../crates/kronika-reader" }
kronika-registry = { path = "../../crates/kronika-registry" }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kronika-writer = { path = "../../crates/kronika-writer" }
tempfile = "3"

[lints]
workspace = true
