[package]
name = "pg_kronika-web"
description = "Local PGM UI and JSON API with bounded diff, anomaly, and incident queries"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Builds the exact-head parity qualification executable and its deterministic
# persistence-fault hooks. The production server does not enable this feature.
qualification = [
  "dep:http-body-util",
  "dep:kronika-format",
  "dep:kronika-layout",
  "dep:rustix",
  "dep:tower",
  "kronika-reader/qualification",
]

[dependencies]
kronika-analytics = { path = "../../crates/kronika-analytics" }
kronika-reader = { path = "../../crates/kronika-reader" }
kronika-registry = { path = "../../crates/kronika-registry" }
kronika-format = { path = "../../crates/kronika-format", optional = true }
kronika-layout = { path = "../../crates/kronika-layout", optional = true }
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"
arc-swap = "1"
base64 = "0.22"
subtle = "2"
rust-embed = { version = "8", features = ["mime-guess"] }
rustix = { version = "1", features = ["time"], optional = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
utoipa = { version = "5", features = ["yaml"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
mimalloc = { version = "0.1", features = ["override"] }
sha2 = "0.10"
http-body-util = { version = "0.1", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

[dev-dependencies]
kronika-format = { path = "../../crates/kronika-format" }
kronika-layout = { path = "../../crates/kronika-layout" }
kronika-reader = { path = "../../crates/kronika-reader", features = ["qualification"] }
kronika-store = { path = "../../crates/kronika-store" }
kronika-writer = { path = "../../crates/kronika-writer" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "anomalies"
harness = false

[[example]]
name = "overview_parity_qualification"
path = "examples/overview_qualification.rs"
required-features = ["qualification"]

[[example]]
name = "export_openapi"
path = "examples/export_openapi.rs"

[lints]
workspace = true
