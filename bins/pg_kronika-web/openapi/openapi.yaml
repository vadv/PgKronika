info:
  description: Bounded local access to retained PostgreSQL telemetry and derived analysis.
  license:
    identifier: MIT
    name: MIT
  title: PgKronika Web API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/anomalies:
    $ref: paths/analytics.yaml#/~1v1~1anomalies
  /v1/data/quality:
    $ref: paths/ui.yaml#/~1v1~1data~1quality
  /v1/entity/{view}/{entity}:
    $ref: paths/ui.yaml#/~1v1~1entity~1{view}~1{entity}
  /v1/frame/{view}:
    $ref: paths/ui.yaml#/~1v1~1frame~1{view}
  /v1/incidents:
    $ref: paths/analytics.yaml#/~1v1~1incidents
  /v1/section/{name}:
    $ref: paths/sections.yaml#/~1v1~1section~1{name}
  /v1/section/{name}/diff:
    $ref: paths/sections.yaml#/~1v1~1section~1{name}~1diff
  /v1/sections:
    $ref: paths/sections.yaml#/~1v1~1sections
  /v1/sections/batch:
    $ref: paths/sections.yaml#/~1v1~1sections~1batch
  /v1/sections/batch/diff:
    $ref: paths/sections.yaml#/~1v1~1sections~1batch~1diff
  /v1/segments:
    $ref: paths/sections.yaml#/~1v1~1segments
  /v1/storage:
    $ref: paths/ui.yaml#/~1v1~1storage
  /v1/timeline/events:
    $ref: paths/timeline.yaml#/~1v1~1timeline~1events
  /v1/timeline/health:
    $ref: paths/timeline.yaml#/~1v1~1timeline~1health
  /v1/timeline/heatmap:
    $ref: paths/ui.yaml#/~1v1~1timeline~1heatmap
  /v1/timeline/overview:
    $ref: paths/timeline.yaml#/~1v1~1timeline~1overview
  /v1/timeline/spine:
    $ref: paths/ui.yaml#/~1v1~1timeline~1spine
  /v1/ui/catalog:
    $ref: paths/ui.yaml#/~1v1~1ui~1catalog
  /v1/ui/context:
    $ref: paths/ui.yaml#/~1v1~1ui~1context
  /v1/version:
    $ref: paths/core.yaml#/~1v1~1version
  /v1/views/summary:
    $ref: paths/ui.yaml#/~1v1~1views~1summary
tags:
- description: Process and wire-format metadata.
  name: core
- description: Registry catalogs, retained rows, and counter diffs.
  name: sections
- description: Bounded anomaly and incident analysis.
  name: analytics
- description: Typed event, health, and overview projections.
  name: timeline
- description: Stable indexed projections consumed by the embedded UI.
  name: ui
