/v1/timeline/events:
  get:
    operationId: events
    parameters:
    - in: query
      name: from
      required: true
      schema:
        format: int64
        type: integer
    - in: query
      name: to
      required: true
      schema:
        format: int64
        type: integer
    - in: query
      name: limit
      required: false
      schema:
        minimum: 0
        type: integer
    - in: query
      name: cursor
      required: false
      schema:
        type: string
    - example: warning
      in: query
      name: min_severity
      required: false
      schema:
        type: string
    - example: pg.database.deadlock_delta
      in: query
      name: kind
      required: false
      schema:
        type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: ../schemas/timeline.yaml#/EventsResponseDto
        description: Paginated notable timeline events
      '400':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Invalid query or cursor
      '401':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Authentication required
      '410':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Cursor expired or retained view is gone
      '413':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Timeline query limit exceeded
      '500':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Timeline read or render failed
      '503':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Cursor or cold-build capacity unavailable
    summary: '`GET /v1/timeline/events?from=..&to=..&limit=..&cursor=..`.'
    tags:
    - timeline
