/v1/timeline/heatmap:
  get:
    operationId: heatmap
    parameters:
    - example: activity
      in: query
      name: view
      required: true
      schema:
        type: string
    - example: wait
      in: query
      name: metric
      required: true
      schema:
        type: string
    - in: query
      name: from
      required: true
      schema:
        format: int64
        type: integer
    - in: query
      name: to
      required: true
      schema:
        format: int64
        type: integer
    - in: query
      name: buckets
      required: false
      schema:
        minimum: 0
        type: integer
    - in: query
      name: top
      required: false
      schema:
        minimum: 0
        type: integer
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: ../schemas/ui.yaml#/HeatmapResponse
        description: Bounded entity heatmap
      '400':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Invalid or oversized query shape
      '401':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Authentication required
      '413':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Serialized response limit exceeded
      '500':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: UI index read or render failed
    summary: '`GET /v1/timeline/heatmap` — bounded web-index entity-series merge.'
    tags:
    - ui
