/v1/ui/catalog:
  get:
    operationId: catalog
    parameters:
    - in: header
      name: If-None-Match
      required: false
      schema:
        type:
        - string
        - 'null'
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: ../schemas/ui.yaml#/ProjectionCatalog
        description: Availability-aware UI projection catalog
      '304':
        description: Catalog ETag matches If-None-Match
      '400':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Invalid query
      '401':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Authentication required
      '500':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Catalog read or render failed
    summary: '`GET /v1/ui/catalog` — stable UI projections.'
    tags:
    - ui
