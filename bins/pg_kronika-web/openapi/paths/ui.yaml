/v1/data/quality:
  get:
    operationId: data_quality
    parameters:
    - in: query
      name: from
      required: true
      schema:
        format: int64
        type: integer
    - in: query
      name: to
      required: true
      schema:
        format: int64
        type: integer
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: ../schemas/ui.yaml#/DataQualityResponse
        description: Retained data quality facts
      '400':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Invalid or oversized quality query
      '401':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Authentication required
      '413':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Serialized response limit exceeded
      '500':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Quality status or index read failed
    summary: '`GET /v1/data/quality` - freshness, coverage, producer and integrity facts.'
    tags:
    - ui
/v1/entity/{view}/{entity}:
  get:
    operationId: entity
    parameters:
    - in: path
      name: view
      required: true
      schema:
        type: string
    - in: path
      name: entity
      required: true
      schema:
        type: string
    - in: query
      name: at
      required: false
      schema:
        format: int64
        type: integer
    - in: query
      name: include
      required: false
      schema:
        type: string
    - in: query
      name: from
      required: false
      schema:
        format: int64
        type: integer
    - in: query
      name: to
      required: false
      schema:
        format: int64
        type: integer
    - in: query
      name: columns
      required: false
      schema:
        type: string
    - in: query
      name: limit
      required: false
      schema:
        maximum: 2000
        minimum: 1
        type: integer
    - in: query
      name: cursor
      required: false
      schema:
        type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: ../schemas/ui.yaml#/EntityResponse
        description: Entity detail or history page
      '400':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Invalid entity token or query mode
      '401':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Authentication required
      '404':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Entity is absent from the selected snapshot
      '413':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Entity history or response limit exceeded
      '500':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Entity projection or storage read failed
    summary: '`GET /v1/entity/{view}/{entity}` - one entity detail or bounded history.'
    tags:
    - ui
/v1/frame/{view}:
  get:
    operationId: frame
    parameters:
    - in: path
      name: view
      required: true
      schema:
        type: string
    - in: query
      name: at
      required: true
      schema:
        format: int64
        type: integer
    - in: query
      name: span
      required: false
      schema:
        type: string
    - in: query
      name: preset
      required: false
      schema:
        type: string
    - in: query
      name: columns
      required: false
      schema:
        type: string
    - in: query
      name: database
      required: false
      schema:
        type: string
    - in: query
      name: q
      required: false
      schema:
        type: string
    - in: query
      name: sort
      required: false
      schema:
        type: string
    - in: query
      name: order
      required: false
      schema:
        type: string
    - in: query
      name: limit
      required: false
      schema:
        minimum: 0
        type: integer
    - in: query
      name: cursor
      required: false
      schema:
        type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: ../schemas/ui.yaml#/FrameResponse
        description: Bounded classified frame
      '400':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Invalid frame query
      '401':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Authentication required
      '410':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Frame cursor snapshot expired
      '413':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Frame resource limit exceeded
      '500':
        content:
          application/json:
            schema:
              $ref: ../schemas/common.yaml#/ApiError
        description: Frame storage or render failed
    summary: '`GET /v1/frame/{view}` - bounded exact UI rows with server-owned verdicts.'
    tags:
    - ui
