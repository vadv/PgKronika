ApiRow:
  additionalProperties:
    $ref: common.yaml#/ApiValue
  description: One section row keyed by registry column name.
  propertyNames:
    type: string
  type: object
DiffNoDataPoint:
  description: An observation where no valid delta can be derived.
  properties:
    nodata:
      $ref: '#/NoDataReason'
    ts:
      format: int64
      type: integer
  required:
  - ts
  - nodata
  type: object
DiffPointResponse:
  description: One timestamped diff result.
  oneOf:
  - $ref: '#/DiffValuePoint'
  - $ref: '#/DiffNoDataPoint'
DiffScalar:
  anyOf:
  - type: 'null'
  - format: int64
    type: integer
  - format: double
    type: number
  description: Finite numeric delta; non-finite floating-point values become null.
DiffSeriesResponse:
  description: Per-identity series with dynamically named cumulative columns.
  properties:
    columns:
      additionalProperties:
        items:
          $ref: '#/DiffPointResponse'
        type: array
      propertyNames:
        type: string
      type: object
    key:
      additionalProperties:
        $ref: common.yaml#/ApiValue
      propertyNames:
        type: string
      type: object
  required:
  - key
  - columns
  type: object
DiffValuePoint:
  description: A measured delta and rate between two observations.
  properties:
    delta:
      $ref: '#/DiffScalar'
    dt_micros:
      format: int64
      type: integer
    rate:
      format: double
      type:
      - number
      - 'null'
    ts:
      format: int64
      type: integer
  required:
  - ts
  - delta
  - rate
  - dt_micros
  type: object
GapResponse:
  description: Half-open range where section data is unavailable.
  properties:
    from:
      format: int64
      type: integer
    to:
      format: int64
      type: integer
  required:
  - from
  - to
  type: object
NoDataReason:
  description: Stable reason for a missing diff point.
  enum:
  - reset
  - gap
  - first_point
  - anomaly
  - not_collected
  type: string
SectionCatalogEntry:
  description: Registry metadata for one logical section.
  properties:
    columns:
      items:
        $ref: '#/SectionColumnResponse'
      type: array
    name:
      type: string
    semantics:
      type: string
    sort_key:
      items:
        type: string
      type: array
  required:
  - name
  - semantics
  - sort_key
  - columns
  type: object
SectionColumnResponse:
  description: One physical column exposed by a logical section.
  properties:
    class:
      type: string
    name:
      type: string
    type:
      type: string
  required:
  - name
  - type
  - class
  type: object
SectionDiffResponse:
  description: Diff of one logical section over a requested range.
  properties:
    identity:
      items:
        type: string
      type: array
    section:
      type: string
    series:
      items:
        $ref: '#/DiffSeriesResponse'
      type: array
  required:
  - section
  - identity
  - series
  type: object
SectionPageResponse:
  description: One bounded page of decoded section rows.
  properties:
    gaps:
      items:
        $ref: '#/GapResponse'
      type: array
    next_cursor:
      type:
      - string
      - 'null'
    rows:
      items:
        $ref: '#/ApiRow'
      type: array
    section:
      type: string
  required:
  - section
  - rows
  - gaps
  - next_cursor
  type: object
SectionsBatchDiffResponse:
  additionalProperties:
    $ref: '#/SectionDiffResponse'
  description: Section diffs keyed by requested logical section name.
  propertyNames:
    type: string
  type: object
SectionsBatchResponse:
  additionalProperties:
    $ref: '#/SectionPageResponse'
  description: Section pages keyed by requested logical section name.
  propertyNames:
    type: string
  type: object
SectionsResponse:
  description: Complete logical section catalog.
  properties:
    sections:
      items:
        $ref: '#/SectionCatalogEntry'
      type: array
  required:
  - sections
  type: object
SegmentResponse:
  description: Catalog-only metadata for one retained segment.
  properties:
    max_ts:
      format: int64
      type: integer
    min_ts:
      format: int64
      type: integer
    sections:
      items:
        $ref: '#/SegmentSectionResponse'
      type: array
    segment_id:
      type: string
  required:
  - segment_id
  - min_ts
  - max_ts
  - sections
  type: object
SegmentSectionResponse:
  description: Row count for one logical section in a segment.
  properties:
    name:
      type: string
    rows:
      format: int64
      minimum: 0
      type: integer
  required:
  - name
  - rows
  type: object
SegmentsResponse:
  description: Segments overlapping the requested time range.
  properties:
    segments:
      items:
        $ref: '#/SegmentResponse'
      type: array
  required:
  - segments
  type: object
