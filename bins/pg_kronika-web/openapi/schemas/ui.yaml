Availability:
  description: Availability of one input, metric, or column in the served store.
  enum:
  - available
  - gated
  - not_collected
  - unsupported_type
  type: string
BoundaryDto:
  properties:
    operator:
      type: string
    value:
      format: double
      type: number
  required:
  - operator
  - value
  type: object
CapabilityDto:
  properties:
    code:
      type: string
    kind:
      type: string
    reason:
      type:
      - string
      - 'null'
    status:
      $ref: '#/CapabilityStatus'
  required:
  - kind
  - code
  - status
  - reason
  type: object
CapabilityStatus:
  enum:
  - available
  - unavailable
  - partial
  type: string
CellClassificationDto:
  properties:
    column:
      type: string
    metric:
      type: string
    result:
      $ref: '#/ClassificationResultDto'
  required:
  - column
  - metric
  - result
  type: object
ClassificationResultDto:
  oneOf:
  - $ref: '#/ClassifiedResultDto'
  - $ref: '#/NotClassifiedResultDto'
ClassifiedResultDto:
  properties:
    boundary:
      oneOf:
      - type: 'null'
      - $ref: '#/BoundaryDto'
    evidence:
      $ref: '#/EvidenceDto'
    level:
      type: string
    status:
      type: string
  required:
  - status
  - level
  - evidence
  type: object
CollectionStatusDto:
  properties:
    collected:
      format: int64
      minimum: 0
      type: integer
    read_state:
      type: string
    source_total:
      format: int64
      minimum: 0
      type:
      - integer
      - 'null'
    visibility:
      type: string
  required:
  - collected
  - source_total
  - read_state
  - visibility
  type: object
ColumnSpec:
  description: One table or detail projection column.
  properties:
    availability:
      $ref: '#/Availability'
      description: Store-observed availability.
    code:
      description: Stable column code.
      type: string
    formula:
      description: Formula when this is a derived projection.
      type:
      - string
      - 'null'
    lazy:
      description: Whether frame omits the value and detail loads it.
      type: boolean
    requires:
      description: Input groups required by this column.
      items:
        type: string
      type: array
    source:
      description: Raw source field when this is a direct projection.
      type:
      - string
      - 'null'
    threshold_metric:
      description: Bound numeric threshold policy, when one exists.
      type:
      - string
      - 'null'
    type:
      $ref: '#/ValueType'
      description: Public value shape.
    unavailable_reason:
      description: Machine reason when the column is not available.
      type:
      - string
      - 'null'
    unit:
      description: Public unit code when the value has a stable numeric unit.
      type:
      - string
      - 'null'
  required:
  - code
  - type
  - lazy
  - requires
  - availability
  type: object
ContextDatabase:
  properties:
    entity:
      type: string
    name:
      type: string
    oid:
      format: int32
      minimum: 0
      type: integer
    visibility:
      type: string
  required:
  - entity
  - oid
  - name
  - visibility
  type: object
ContextGap:
  properties:
    from_us:
      type: string
    to_us:
      type: string
  required:
  - from_us
  - to_us
  type: object
ContextHost:
  properties:
    boot_id:
      type:
      - string
      - 'null'
    kernel_version:
      type:
      - string
      - 'null'
    logical_cpu_count:
      minimum: 0
      type:
      - integer
      - 'null'
    logical_cpu_count_reason:
      type:
      - string
      - 'null'
  type: object
ContextInstance:
  properties:
    hostname:
      type:
      - string
      - 'null'
    pg_system_identifier:
      type:
      - string
      - 'null'
    pg_system_identifier_reason:
      type:
      - string
      - 'null'
    pg_version_num:
      format: int64
      type:
      - integer
      - 'null'
    role:
      type:
      - string
      - 'null'
    role_reason:
      type:
      - string
      - 'null'
  type: object
ContextQuality:
  properties:
    active_tail:
      type: boolean
    gaps:
      items:
        $ref: '#/ContextGap'
      type: array
    gated:
      items:
        type: string
      type: array
    status:
      type: string
  required:
  - status
  - gaps
  - gated
  - active_tail
  type: object
ContextReplica:
  properties:
    application_name:
      type:
      - string
      - 'null'
    entity:
      type: string
    pid:
      format: int64
      type: integer
    replay_lag_reason:
      type:
      - string
      - 'null'
    replay_lag_us:
      format: int64
      type:
      - integer
      - 'null'
    state:
      type:
      - string
      - 'null'
    sync_state:
      type:
      - string
      - 'null'
  required:
  - entity
  - pid
  type: object
ContextReplication:
  properties:
    instance:
      oneOf:
      - type: 'null'
      - $ref: '#/ContextReplicationInstance'
    replicas:
      items:
        $ref: '#/ContextReplica'
      type: array
  required:
  - replicas
  type: object
ContextReplicationInstance:
  properties:
    replay_lag_reason:
      type:
      - string
      - 'null'
    replay_lag_us:
      format: int64
      type:
      - integer
      - 'null'
    streaming_replicas:
      format: int64
      type:
      - integer
      - 'null'
    timeline_id:
      format: int64
      type:
      - integer
      - 'null'
  required:
  - timeline_id
  - streaming_replicas
  - replay_lag_us
  - replay_lag_reason
  type: object
ContextResponse:
  properties:
    databases:
      items:
        $ref: '#/ContextDatabase'
      type: array
    host:
      $ref: '#/ContextHost'
    instance:
      $ref: '#/ContextInstance'
    quality:
      $ref: '#/ContextQuality'
    replication:
      $ref: '#/ContextReplication'
    snapshot_ts_us:
      type:
      - string
      - 'null'
  required:
  - snapshot_ts_us
  - instance
  - host
  - databases
  - replication
  - quality
  type: object
CoverageDto:
  properties:
    complete_snapshots:
      format: int64
      minimum: 0
      type: integer
    expected_snapshots:
      format: int64
      minimum: 0
      type:
      - integer
      - 'null'
    observed_snapshots:
      format: int64
      minimum: 0
      type: integer
  required:
  - expected_snapshots
  - observed_snapshots
  - complete_snapshots
  type: object
DataQualityFreshnessDto:
  properties:
    age_us:
      type:
      - string
      - 'null'
    data_through_us:
      type:
      - string
      - 'null'
    expected_period_us:
      type:
      - string
      - 'null'
    state:
      $ref: '#/FreshnessState'
  required:
  - data_through_us
  - age_us
  - expected_period_us
  - state
  type: object
DataQualityIntegrityDto:
  properties:
    corrupt_segments:
      minimum: 0
      type: integer
    last_catalog_refresh_us:
      type:
      - string
      - 'null'
    quarantined_entries:
      minimum: 0
      type:
      - integer
      - 'null'
    readable_segments:
      minimum: 0
      type: integer
    status:
      $ref: '#/IntegrityStatus'
  required:
  - status
  - readable_segments
  - corrupt_segments
  - quarantined_entries
  - last_catalog_refresh_us
  type: object
DataQualityMetaDto:
  properties:
    active_tail:
      type: boolean
    resource_limited:
      items:
        type: string
      type: array
    status:
      type: string
  required:
  - status
  - resource_limited
  - active_tail
  type: object
DataQualityResponse:
  properties:
    capabilities:
      items:
        $ref: '#/CapabilityDto'
      type: array
    coverage:
      $ref: '#/CoverageDto'
    freshness:
      $ref: '#/DataQualityFreshnessDto'
    gaps:
      items:
        $ref: '#/QualityGap'
      type: array
    integrity:
      $ref: '#/DataQualityIntegrityDto'
    producer:
      $ref: '#/ProducerDto'
    quality:
      $ref: '#/DataQualityMetaDto'
    status:
      $ref: '#/DataQualityStatus'
  required:
  - status
  - freshness
  - producer
  - coverage
  - gaps
  - capabilities
  - integrity
  - quality
  type: object
DataQualityStatus:
  enum:
  - fresh
  - late
  - stale
  - unavailable
  - partial
  type: string
EntityFieldDto:
  properties:
    code:
      type: string
    value:
      $ref: '#/FrameValue'
  required:
  - code
  - value
  type: object
EntityGapDto:
  properties:
    from_us:
      type: string
    to_us:
      type: string
  required:
  - from_us
  - to_us
  type: object
EntityHistoryResponse:
  properties:
    columns:
      items:
        type: string
      type: array
    entity:
      type: string
    label:
      description: |-
        Label of the first observed snapshot; empty when the entity never
        appears in the window.
      type: string
    mode:
      type: string
    page:
      $ref: '#/EntityPageDto'
    quality:
      $ref: '#/EntityQualityDto'
    snapshots:
      items:
        $ref: '#/EntitySnapshotDto'
      type: array
    view:
      type: string
  required:
  - mode
  - view
  - entity
  - label
  - columns
  - snapshots
  - page
  - quality
  type: object
EntityPageDto:
  properties:
    next:
      type:
      - string
      - 'null'
  required:
  - next
  type: object
EntityPointResponse:
  properties:
    entity:
      type: string
    fields:
      items:
        $ref: '#/EntityFieldDto'
      type: array
    label:
      description: |-
        Human row label from the same projection as frame rows — the entity
        token above is routing material, never display text.
      type: string
    mode:
      type: string
    quality:
      $ref: '#/EntityQualityDto'
    related:
      items:
        $ref: '#/RelatedEntityDto'
      type: array
    snapshot_ts_us:
      type: string
    view:
      type: string
  required:
  - mode
  - view
  - entity
  - label
  - snapshot_ts_us
  - fields
  - related
  - quality
  type: object
EntityQualityDto:
  properties:
    gaps:
      items:
        $ref: '#/EntityGapDto'
      type: array
    gated:
      items:
        type: string
      type: array
    status:
      type: string
  required:
  - status
  - gaps
  - gated
  type: object
EntityResponse:
  oneOf:
  - $ref: '#/EntityPointResponse'
  - $ref: '#/EntityHistoryResponse'
EntitySnapshotDto:
  properties:
    ts_us:
      type: string
    values:
      items:
        $ref: '#/FrameValue'
      type: array
  required:
  - ts_us
  - values
  type: object
EvidenceDto:
  oneOf:
  - properties:
      kind:
        enum:
        - scalar
        type: string
      observed:
        format: double
        type: number
    required:
    - observed
    - kind
    type: object
  - properties:
      denominator:
        format: double
        type: number
      kind:
        enum:
        - fraction
        type: string
      numerator:
        format: double
        type: number
      value:
        format: double
        type: number
    required:
    - numerator
    - denominator
    - value
    - kind
    type: object
  - properties:
      kind:
        enum:
        - limit
        type: string
      limit:
        format: double
        type: number
      observed:
        format: double
        type: number
    required:
    - observed
    - limit
    - kind
    type: object
  - properties:
      count:
        format: double
        type: number
      floor:
        $ref: '#/BoundaryDto'
      kind:
        enum:
        - ratio_with_floor
        type: string
      ratio:
        format: double
        type: number
    required:
    - ratio
    - count
    - floor
    - kind
    type: object
  - properties:
      age_seconds:
        format: double
        type: number
      epoch_seconds:
        format: double
        type: number
      kind:
        enum:
        - age
        type: string
      now_seconds:
        format: double
        type: number
    required:
    - epoch_seconds
    - now_seconds
    - age_seconds
    - kind
    type: object
  - properties:
      absolute_ceiling_bytes:
        $ref: '#/BoundaryDto'
      available_bytes:
        format: double
        type: number
      available_fraction:
        format: double
        type: number
      kind:
        enum:
        - free_capacity
        type: string
      total_bytes:
        format: double
        type: number
    required:
    - available_bytes
    - total_bytes
    - available_fraction
    - absolute_ceiling_bytes
    - kind
    type: object
FilesystemDto:
  properties:
    available_bytes:
      format: int64
      minimum: 0
      type: integer
    total_bytes:
      format: int64
      minimum: 0
      type: integer
    used_fraction:
      format: double
      type: number
  required:
  - total_bytes
  - available_bytes
  - used_fraction
  type: object
ForecastDto:
  properties:
    full_in_days:
      format: double
      type:
      - number
      - 'null'
    full_in_days_reason:
      type:
      - string
      - 'null'
    window_us:
      type: string
    write_rate_bytes_per_day:
      format: int64
      minimum: 0
      type:
      - integer
      - 'null'
  required:
  - write_rate_bytes_per_day
  - window_us
  - full_in_days
  - full_in_days_reason
  type: object
FrameColumnDto:
  properties:
    code:
      type: string
    hidden:
      description: Whether the column is materialized only for sort or field filtering.
      type: boolean
    threshold_metric:
      type:
      - string
      - 'null'
    type:
      type: string
    unit:
      type:
      - string
      - 'null'
  required:
  - code
  - type
  - hidden
  type: object
FrameGapDto:
  properties:
    from_us:
      type: string
    to_us:
      type: string
  required:
  - from_us
  - to_us
  type: object
FrameNeighborsDto:
  properties:
    next_us:
      type:
      - string
      - 'null'
    prev_us:
      type:
      - string
      - 'null'
  type: object
FramePageDto:
  properties:
    matched:
      minimum: 0
      type: integer
    next:
      type:
      - string
      - 'null'
    returned:
      minimum: 0
      type: integer
  required:
  - returned
  - matched
  type: object
FrameQualityDto:
  properties:
    active_tail:
      type: boolean
    gaps:
      items:
        $ref: '#/FrameGapDto'
      type: array
    gated:
      items:
        type: string
      type: array
    resource_limited:
      items:
        type: string
      type: array
    snapshots:
      minimum: 0
      type: integer
    status:
      type: string
    unavailable_revision:
      items:
        type: string
      type: array
  required:
  - status
  - snapshots
  - gaps
  - gated
  - unavailable_revision
  - resource_limited
  - active_tail
  type: object
FrameResponse:
  properties:
    columns:
      items:
        $ref: '#/FrameColumnDto'
      type: array
    neighbors:
      $ref: '#/FrameNeighborsDto'
    page:
      $ref: '#/FramePageDto'
    quality:
      $ref: '#/FrameQualityDto'
    rate_prev_ts_us:
      type:
      - string
      - 'null'
    rows:
      items:
        $ref: '#/FrameRowDto'
      type: array
    snapshot_ts_us:
      type: string
    view:
      type: string
  required:
  - view
  - snapshot_ts_us
  - neighbors
  - columns
  - rows
  - page
  - quality
  type: object
FrameRowDto:
  properties:
    cells:
      items:
        $ref: '#/FrameValue'
      type: array
    classifications:
      items:
        $ref: '#/CellClassificationDto'
      type: array
    entity:
      type: string
    label:
      type: string
    spark:
      $ref: '#/SparkDto'
  required:
  - entity
  - label
  - cells
  - classifications
  - spark
  type: object
FrameValue:
  anyOf:
  - type: 'null'
  - format: double
    type: number
  - type: boolean
  - type: string
  description: A finite frame scalar; wide integers and timestamps use decimal strings.
FreshnessState:
  enum:
  - fresh
  - late
  - stale
  - unknown
  type: string
HeatmapGrid:
  properties:
    bucket_count:
      minimum: 0
      type: integer
    from_us:
      type: string
    to_us:
      type: string
  required:
  - from_us
  - to_us
  - bucket_count
  type: object
HeatmapQuality:
  properties:
    active_tail:
      type: boolean
    gaps:
      items:
        $ref: '#/RangeGap'
      type: array
    gated:
      items:
        type: string
      type: array
    resource_limited:
      items:
        type: string
      type: array
    snapshots:
      minimum: 0
      type: integer
    status:
      type: string
    unavailable_revision:
      items:
        type: string
      type: array
    unbounded_segments:
      items:
        type: string
      type: array
  required:
  - status
  - snapshots
  - gaps
  - gated
  - unavailable_revision
  - resource_limited
  - unbounded_segments
  - active_tail
  type: object
HeatmapResponse:
  properties:
    grid:
      $ref: '#/HeatmapGrid'
    quality:
      $ref: '#/HeatmapQuality'
    ranking:
      $ref: '#/Ranking'
    rows:
      items:
        $ref: '#/HeatmapRow'
      type: array
  required:
  - grid
  - ranking
  - rows
  - quality
  type: object
HeatmapRow:
  properties:
    entity:
      type: string
    label:
      type: string
    score:
      $ref: '#/ScoreBounds'
    unit:
      type: string
    values:
      items:
        format: double
        type:
        - number
        - 'null'
      type: array
  required:
  - entity
  - label
  - unit
  - score
  - values
  type: object
InputSpec:
  description: One alternative group of physical inputs for a view.
  properties:
    availability:
      $ref: '#/Availability'
      description: Store-observed availability.
    code:
      description: Stable input code referenced by metrics and columns.
      type: string
    logical_sections:
      description: Logical registry sections accepted by this input.
      items:
        type: string
      type: array
    type_ids:
      description: Supported physical type IDs for the logical sections.
      items:
        format: int32
        minimum: 0
        type: integer
      type: array
    unavailable_reason:
      description: Machine reason when the input is not available.
      type:
      - string
      - 'null'
  required:
  - code
  - logical_sections
  - type_ids
  - availability
  type: object
IntegrityStatus:
  enum:
  - complete
  - degraded
  - unknown
  type: string
JoinSpec:
  description: A proven or conditional relationship between two inputs.
  properties:
    cardinality:
      description: Declared join cardinality.
      type: string
    fields:
      description: Equality fields, in comparison order.
      items:
        type: string
      type: array
    left:
      description: Left input code.
      type: string
    provenance:
      description: Evidence required before the join is accepted.
      type: string
    right:
      description: Right input code.
      type: string
  required:
  - left
  - right
  - fields
  - cardinality
  - provenance
  type: object
MetricSpec:
  description: One heatmap or spark metric.
  properties:
    aggregation:
      description: Bucket aggregation across segments.
      type: string
    availability:
      $ref: '#/Availability'
      description: Store-observed availability.
    code:
      description: Stable metric code inside its view.
      type: string
    formula:
      description: Normative formula over projected inputs.
      type: string
    requires:
      description: Input groups required by the formula.
      items:
        type: string
      type: array
    revision:
      description: Independently changeable projection revision.
      format: int32
      minimum: 0
      type: integer
    unavailable_reason:
      description: Machine reason when the metric is not available.
      type:
      - string
      - 'null'
    unit:
      description: Public unit code.
      type: string
  required:
  - code
  - revision
  - unit
  - aggregation
  - formula
  - requires
  - availability
  type: object
NotClassifiedResultDto:
  properties:
    reason:
      type: string
    status:
      type: string
  required:
  - status
  - reason
  type: object
NotableLevelDto:
  enum:
  - none
  - info
  - warning
  - critical
  type: string
PresetSpec:
  description: Named ordered subset of view columns.
  properties:
    code:
      description: Stable preset code.
      type: string
    columns:
      description: Columns returned by the preset, in display order.
      items:
        type: string
      type: array
    sort:
      $ref: '#/SortSpec'
      description: Default sort.
  required:
  - code
  - columns
  - sort
  type: object
ProducerDto:
  properties:
    collector_pid:
      format: int32
      minimum: 0
      type:
      - integer
      - 'null'
    collector_started_at_us:
      type:
      - string
      - 'null'
    last_status_at_us:
      type:
      - string
      - 'null'
    state:
      $ref: '#/ProducerStateDto'
  required:
  - state
  - collector_pid
  - collector_started_at_us
  - last_status_at_us
  type: object
ProducerStateDto:
  enum:
  - running
  - stopped
  - unknown
  type: string
ProjectionCatalog:
  description: Complete availability-aware catalog response.
  properties:
    revision:
      description: Catalog schema revision.
      format: int32
      minimum: 0
      type: integer
    views:
      items:
        $ref: '#/ViewSpec'
      type: array
  required:
  - revision
  - views
  type: object
QualityGap:
  properties:
    from_us:
      type: string
    reason:
      type: string
    to_us:
      type: string
  required:
  - from_us
  - to_us
  - reason
  type: object
RangeGap:
  properties:
    from_us:
      type: string
    to_us:
      type: string
  required:
  - from_us
  - to_us
  type: object
Ranking:
  properties:
    exact:
      type: boolean
    unseen_upper:
      format: double
      type: number
  required:
  - exact
  - unseen_upper
  type: object
RelatedEntityDto:
  properties:
    entity:
      type: string
    provenance:
      $ref: '#/RelationProvenanceDto'
    relation:
      type: string
    view:
      type: string
  required:
  - relation
  - view
  - entity
  - provenance
  type: object
RelationProvenanceDto:
  properties:
    fields:
      items:
        type: string
      type: array
    kind:
      type: string
  required:
  - kind
  - fields
  type: object
