name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  EXACT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  # CI cargo jobs build for host gnu; .cargo/config pins musl for release
  # binaries, but runners have no musl std, so tests/lint can't find core.
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_HEAD }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  deps:
    name: dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_HEAD }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- check-deps
      - run: bash scripts/test-bdd-image.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_HEAD }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_HEAD }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage
        run: |
          cargo llvm-cov --workspace --summary-only --json --output-path coverage.json
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json

  overview-qualification:
    name: overview qualification artifact
    runs-on: ubuntu-latest
    env:
      OVERVIEW_DENSE_DISK_BUDGET_BYTES: ${{ vars.OVERVIEW_DENSE_DISK_BUDGET_BYTES }}
      OVERVIEW_DENSE_RESIDENT_BUDGET_BYTES: ${{ vars.OVERVIEW_DENSE_RESIDENT_BUDGET_BYTES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_HEAD }}
      - uses: Swatinem/rust-cache@v2
      - name: Measure exact-head dense-hour modes
        run: |
          command -v strace
          python3 scripts/test_validate_overview_qualification.py
          cargo run --release --manifest-path bins/pg_kronika-web/Cargo.toml --example overview_parity_qualification --features qualification -- --output target/qualification/overview.raw.json
          python3 scripts/validate-overview-qualification.py target/qualification/overview.raw.json --exact-head "${EXACT_SOURCE_HEAD}" --output target/qualification/validation.preliminary.json
          sha256sum target/qualification/overview.raw.json > target/qualification/overview.raw.json.sha256
          sha256sum target/qualification/validation.preliminary.json > target/qualification/validation.preliminary.json.sha256
          {
            echo '## Overview qualification measurements'
            echo
            echo "- exact head: \`${EXACT_SOURCE_HEAD}\`"
            echo "- run attempt: \`${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}\`"
            echo "- raw artifact: \`overview-qualification-raw\`"
            echo
            echo 'Nine production endpoint modes plus the §18.4.6 compact performance profile, with raw process, I/O, syscall, accounting, concurrency, recovery, and latency evidence, passed preliminary validation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: overview-qualification-raw
          path: |
            target/qualification/overview.raw.json
            target/qualification/overview.raw.json.sha256
            target/qualification/validation.preliminary.json
            target/qualification/validation.preliminary.json.sha256

  bdd-matrix:
    name: bdd matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BDD_PLATFORM: linux/amd64
      BDD_RUNTIME_IMAGE: pgkronika-bdd:run-${{ github.run_id }}-${{ github.run_attempt }}
      BDD_BUILDER_CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_HEAD }}
      - name: Compute exact dependency builder
        id: meta
        run: |
          deps_hash=$(./scripts/bdd-image.sh deps-key)
          platform_slug=$(./scripts/bdd-image.sh platform-slug)
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          builder="ghcr.io/${owner}/pgkronika-bdd-builder:builder-${platform_slug}-${deps_hash:0:16}"
          {
            echo "deps_hash=${deps_hash}"
            echo "builder=${builder}"
            echo "can_push=${BDD_BUILDER_CAN_PUSH}"
          } >> "$GITHUB_OUTPUT"
          echo "BDD dependency key: ${deps_hash}"
          echo "BDD exact builder: ${builder}"
          {
            echo '## BDD cache'
            echo
            echo "- dependency key: \`${deps_hash}\`"
            echo "- exact builder: \`${builder}\`"
            echo "- local runtime: \`${BDD_RUNTIME_IMAGE}\` (never published)"
            echo '- source build: always runs; clean hosted runners do not cache first-party compilation'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve exact dependency builder
        id: builder
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.builder }}" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'BDD builder exact hit'
            docker pull "${{ steps.meta.outputs.builder }}"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'BDD builder exact miss'
          fi
      - name: Log in to GHCR for missing builder
        if: steps.builder.outputs.exists != 'true' && steps.meta.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.builder.outputs.exists != 'true'
      - name: Build missing dependency builder
        if: steps.builder.outputs.exists != 'true'
        run: |
          export BDD_BUILDER_IMAGE="${{ steps.meta.outputs.builder }}"
          if [ "${{ steps.meta.outputs.can_push }}" = "true" ]; then
            export BDD_BUILDER_PUSH=1
          fi
          ./scripts/bdd-image.sh build-builder
      - name: Compile source and assemble local BDD runtime
        run: |
          export BDD_BUILDER_IMAGE="${{ steps.meta.outputs.builder }}"
          export BDD_OUTPUT_TAR=image.tar
          started=$SECONDS
          ./scripts/bdd-image.sh build-runtime
          elapsed=$((SECONDS - started))
          echo "BDD source build seconds: ${elapsed}"
          echo "- source build seconds: ${elapsed}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify PostgreSQL runtime
        run: ./scripts/bdd-image.sh check-runtime
      - name: Run the PostgreSQL matrix
        run: ./scripts/bdd-image.sh run

  overview-parity-acceptance:
    name: overview parity acceptance
    if: ${{ always() }}
    needs:
      - lint
      - deps
      - test
      - coverage
      - overview-qualification
      - bdd-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_SOURCE_HEAD }}
      - uses: actions/download-artifact@v4
        with:
          name: overview-qualification-raw
          path: target/qualification
      - name: Bind parity evidence to this exact green attempt
        run: |
          python3 scripts/finalize-overview-qualification.py \
            target/qualification/overview.raw.json \
            --output target/qualification/overview.final.json \
            --exact-head "${EXACT_SOURCE_HEAD}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --job "lint=${{ needs.lint.result }}" \
            --job "deps=${{ needs.deps.result }}" \
            --job "test=${{ needs.test.result }}" \
            --job "coverage=${{ needs.coverage.result }}" \
            --job "overview-qualification=${{ needs.overview-qualification.result }}" \
            --job "bdd-matrix=${{ needs.bdd-matrix.result }}"
          sha256sum target/qualification/overview.final.json > target/qualification/overview.final.json.sha256
          python3 scripts/validate-overview-qualification.py \
            target/qualification/overview.final.json \
            --exact-head "${EXACT_SOURCE_HEAD}" \
            --final \
            --raw-artifact target/qualification/overview.raw.json \
            --checksum-file target/qualification/overview.final.json.sha256 \
            --output target/qualification/validation.final.json
          sha256sum target/qualification/validation.final.json > target/qualification/validation.final.json.sha256
          {
            echo '## Overview parity acceptance'
            echo
            echo "- exact head: \`${EXACT_SOURCE_HEAD}\`"
            echo "- Actions run/attempt: \`${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}\`"
            echo "- artifact: \`overview-parity-acceptance\`"
            echo "- decision: **PASS**"
            echo
            echo 'All 18 rows are IMPLEMENTED and bound to the six successful predecessor jobs, the PostgreSQL 15–18 scenarios, the raw measurement checksum, and this final artifact checksum.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: overview-parity-acceptance
          path: |
            target/qualification/overview.raw.json
            target/qualification/overview.raw.json.sha256
            target/qualification/overview.final.json
            target/qualification/overview.final.json.sha256
            target/qualification/validation.preliminary.json
            target/qualification/validation.preliminary.json.sha256
            target/qualification/validation.final.json
            target/qualification/validation.final.json.sha256
