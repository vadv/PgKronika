[package]
name = "kronika-bdd"
description = "BDD scenarios for collector integration tests inside Docker"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kronika-registry = { path = "../kronika-registry" }
kronika-reader = { path = "../kronika-reader", features = ["qualification"] }
kronika-format = { path = "../kronika-format" }
kronika-layout = { path = "../kronika-layout" }
kronika-writer = { path = "../kronika-writer" }
pg_kronika-web = { path = "../../bins/pg_kronika-web", features = ["qualification"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
sha2 = "0.10"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync"] }
tokio-postgres = "0.7"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tempfile = "3"
portpicker = "0.1"
nix = { version = "0.29", features = ["signal"] }
rustix = { version = "1", features = ["param"] }

[lints]
workspace = true
