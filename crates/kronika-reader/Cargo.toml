[package]
name = "kronika-reader"
description = "Segment read path: catalog, range reads, CRC-verified decode"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Enables deterministic failure injection for the exact-head parity
# qualification executable. Production binaries never enable this feature.
qualification = []

[dependencies]
kronika-format = { path = "../kronika-format" }
kronika-layout = { path = "../kronika-layout" }
kronika-registry = { path = "../kronika-registry" }
kronika-analytics = { path = "../kronika-analytics" }
kronika-store = { path = "../kronika-store" }
arrow-array = "55"
arrow-schema = "55"
parquet = { version = "55", default-features = false, features = ["arrow", "zstd"] }
sha2 = "0.10"
rustix = { version = "1", features = ["fs"] }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
kronika-writer = { path = "../kronika-writer" }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
mimalloc = { version = "0.1", features = ["override"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "serving"
harness = false

[[bench]]
name = "diff_scan"
harness = false

[[bench]]
name = "overview_codec"
harness = false

[lints]
workspace = true
